{% extends "base.html" %}
{% block title %}Too many requests{% endblock %}
{% block content %}
<div class="form-card card" style="text-align:center">
  <h1 class="page-title">Too many requests</h1>
  <p style="color:var(--muted);margin-bottom:1.25rem">
    You have hit the rate limit. Please wait about a minute and try again.
  </p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">Home</a>
</div>
{% endblock %}
