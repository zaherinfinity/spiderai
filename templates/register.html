{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="form-card card">
  <div style="text-align:center;margin-bottom:1.5rem">
    <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="" width="64" height="64" style="border-radius:50%;box-shadow:var(--glow)" />
    <h2 class="page-title" style="margin-top:0.75rem;font-size:1.35rem">Create account</h2>
    <p style="color:var(--muted);font-size:0.9rem">Free · up to 100 MB per video</p>
  </div>
  <form method="post">
    <div class="form-group">
      <label for="username">Username *</label>
      <input type="text" id="username" name="username" required minlength="3" placeholder="min 3 characters" autocomplete="username" />
    </div>
    <div class="form-group">
      <label for="full_name">Full name</label>
      <input type="text" id="full_name" name="full_name" placeholder="optional" />
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="optional" autocomplete="email" />
    </div>
    <div class="form-group">
      <label for="password">Password *</label>
      <input type="password" id="password" name="password" required minlength="6" placeholder="min 6 characters" autocomplete="new-password" />
    </div>
    <div class="form-group">
      <label for="password2">Confirm password *</label>
      <input type="password" id="password2" name="password2" required minlength="6" autocomplete="new-password" />
    </div>
    
    {% if turnstile_enabled %}
    <div class="turnstile-wrap">
      <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}" data-theme="dark"></div>
    </div>
    {% endif %}
    <button type="submit" class="btn btn-primary" style="width:100%">Sign up</button>
  </form>
  <p style="margin-top:1.25rem;text-align:center;color:var(--muted);font-size:0.9rem">
    Already have an account? <a href="{{ url_for('login') }}" style="color:var(--accent)">Login</a>
  </p>
</div>
{% endblock %}

{% block scripts %}
{% if turnstile_enabled %}
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{% endif %}
{% endblock %}
