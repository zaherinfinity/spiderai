{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="form-card card">
  <div style="text-align:center;margin-bottom:1.5rem">
    <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="" width="64" height="64" style="border-radius:50%;box-shadow:var(--glow)" />
    <h2 class="page-title" style="margin-top:0.75rem;font-size:1.35rem">User login</h2>
    <p style="color:var(--muted);font-size:0.9rem">Sign in with your account</p>
  </div>
  <form method="post">
    <div class="form-group">
      <label for="username">Username or email</label>
      <input type="text" id="username" name="username" required placeholder="your username" autocomplete="username" />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required placeholder="Password" autocomplete="current-password" />
    </div>
    
    {% if turnstile_enabled %}
    <div class="turnstile-wrap">
      <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}" data-theme="dark"></div>
    </div>
    {% endif %}
    <button type="submit" class="btn btn-primary" style="width:100%">Login</button>
  </form>
  <p style="margin-top:1.25rem;text-align:center;color:var(--muted);font-size:0.9rem">
    No account? <a href="{{ url_for('register') }}" style="color:var(--accent)">Create one</a>
  </p>
  <p style="margin-top:0.5rem;text-align:center;color:var(--muted);font-size:0.8rem">
  </p>
</div>
{% endblock %}

{% block scripts %}
{% if turnstile_enabled %}
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{% endif %}
{% endblock %}
